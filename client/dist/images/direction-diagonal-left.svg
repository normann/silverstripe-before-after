<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 64 48">
  <!-- "Right-Top to Left-Bottom": divider runs top-left -> bottom-right (NW-SE), the
       handle itself drags along the perpendicular NE-SW axis -->
  <defs>
    <clipPath id="frame-dl"><rect x="1" y="1" width="62" height="46" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#frame-dl)">
    <polygon points="0,0 64,48 0,48" fill="#cbd5e1"/>
    <polygon points="64,0 64,48 0,0" fill="#0f5ff8"/>
    <line x1="0" y1="0" x2="64" y2="48" stroke="#ffffff" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="62" height="46" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <g transform="rotate(-45 32 24)">
    <circle cx="32" cy="24" r="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M24,20 L18,24 L24,28 Z" fill="#334155"/>
    <path d="M40,20 L46,24 L40,28 Z" fill="#334155"/>
  </g>
</svg>
